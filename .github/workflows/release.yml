name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Build
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTOREPWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYALIAS: ${{ secrets.KEY_ALIAS }}
          KEYPWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTOREPATH="$RUNNER_TEMP/release.jks" ./gradlew :AnkiDroid:assembleFullRelease -Duniversal-apk=true
          cp AnkiDroid/build/outputs/apk/full/release/AnkiDroid-full-universal-release.apk AnkiDroid-Dualscreen.apk
          sha256sum AnkiDroid-Dualscreen.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            AnkiDroid-Dualscreen.apk
            SHA256SUMS.txt
          generate_release_notes: true
